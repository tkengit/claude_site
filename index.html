<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kentaro Tsuji</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap">
<style>
  /* Layout: one framed print, centered; each new photo develops in place like a print in the tray. */
  :root {
    --bg: #e8e6e1;
    --frame: #ffffff;
    --ink: #2c2b28;
    --muted: #7a766f;
    --rule: #cfccc5;
    --shadow: 30, 26, 20;
    --sans: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --pad: clamp(12px, 2.4vmin, 28px);   /* white frame width */
    --gutter: clamp(28px, 8vmin, 88px);  /* space around the print */
    --head: 64px;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #1d1c1a; --ink: #e6e3dd; --muted: #8c8880; --rule: #3a3834; --shadow: 0, 0, 0; color-scheme: dark } }
  :root[data-theme="dark"] {
    --bg: #1d1c1a; --ink: #e6e3dd; --muted: #8c8880; --rule: #3a3834; --shadow: 0, 0, 0; color-scheme: dark }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 400 12px/1.5 var(--sans);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  a { color: inherit; text-decoration: none; }
  a:focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; }

  /* ---- header ---- */
  .head {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; justify-content: space-between; align-items: center;
    height: calc(var(--head) + env(safe-area-inset-top, 0px));
    padding-top: env(safe-area-inset-top, 0px);
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
    font-size: 11px; font-weight: 500; letter-spacing: .22em;
  }
  .head a { padding: 8px 0; }
  .head .nav { color: var(--muted); transition: color .2s; }
  .head .nav:hover { color: var(--ink); }

  /* ---- photo stage ---- */
  .stage {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    padding: max(var(--gutter), calc(var(--head) + env(safe-area-inset-top, 0px))) var(--gutter) calc(var(--gutter) + 16px);
    touch-action: pan-y;
    cursor: grab;
    -webkit-user-select: none; user-select: none;
    transition: opacity .5s ease;
  }
  .stage.dragging { cursor: grabbing; }
  .print {
    background: var(--frame);
    padding: var(--pad);
    box-shadow: 0 1px 2px rgba(var(--shadow), .08), 0 12px 34px -14px rgba(var(--shadow), .3);
    transition: transform .7s cubic-bezier(.2, .8, .2, 1);
    will-change: transform;
  }
  .stage.dragging .print { transition: none; }
  .photo {
    position: relative; overflow: hidden;
    width: 300px; height: 200px;
    background: #f6f5f2;
    transition: width .9s cubic-bezier(.65, 0, .25, 1), height .9s cubic-bezier(.65, 0, .25, 1);
  }
  .photo img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover;
    opacity: 0;
    pointer-events: none; -webkit-user-drag: none;
    transition: opacity .6s ease, filter .6s ease;
  }
  .photo img.on { opacity: 1; }
  .photo img.out {                       /* the outgoing print washes away under the light */
    opacity: 0;
    filter: brightness(1.8) contrast(.6) saturate(.2) sepia(0) blur(4px);
  }
  .photo img.dev { animation: develop 1.9s cubic-bezier(.3, .1, .3, 1) both; }
  @keyframes develop {
    0%   { opacity: 0; filter: brightness(2.3) contrast(.45) saturate(0) sepia(0) blur(10px); }
    12%  { opacity: 1; }
    45%  { opacity: 1; filter: brightness(1.35) contrast(.8) saturate(.35) sepia(.3) blur(2px); }
    100% { opacity: 1; filter: brightness(1) contrast(1) saturate(1) sepia(0) blur(0); }
  }
  .count {
    position: fixed; left: 0; right: 0;
    bottom: max(calc(var(--gutter) / 2 - 4px), env(safe-area-inset-bottom, 0px));
    text-align: center; pointer-events: none;
    font: 11px/1 var(--mono); letter-spacing: .12em; color: var(--muted);
    font-variant-numeric: tabular-nums;
    transition: opacity .5s ease;
  }

  /* ---- CV ---- */
  .cv {
    position: fixed; inset: 0; z-index: 5;
    overflow-y: auto;
    padding-top: calc(var(--head) + env(safe-area-inset-top, 0px) + clamp(48px, 14vh, 140px));
    padding-bottom: 80px;
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
    background: var(--bg);
    opacity: 0; visibility: hidden;
    transition: opacity .5s ease, visibility 0s linear .5s;
  }
  .cv-inner { max-width: 620px; margin: 0 auto; }
  .cv h1 { font-size: 13px; font-weight: 500; letter-spacing: .22em; }
  .cv .role { margin-top: 10px; color: var(--muted); font-size: 13px; letter-spacing: .02em; }
  .cv ol { list-style: none; margin-top: 56px; border-top: 1px solid var(--rule); }
  .cv li {
    display: grid; grid-template-columns: 4.5em 1fr; gap: 16px;
    padding: 16px 0; border-bottom: 1px solid var(--rule);
    font-size: 13px; line-height: 1.6;
  }
  .cv li > * { min-width: 0; }
  .cv .yr { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 1px; }
  .cv li, .cv h1, .cv .role { opacity: 0; transform: translateY(6px); transition: opacity .6s ease, transform .6s ease; }

  body.on-cv .cv { opacity: 1; visibility: visible; transition: opacity .5s ease; }
  body.on-cv .cv li, body.on-cv .cv h1, body.on-cv .cv .role { opacity: 1; transform: none; }
  body.on-cv .cv h1 { transition-delay: .1s; }
  body.on-cv .cv .role { transition-delay: .18s; }
  body.on-cv .cv li:nth-child(1) { transition-delay: .26s; }
  body.on-cv .cv li:nth-child(2) { transition-delay: .32s; }
  body.on-cv .cv li:nth-child(3) { transition-delay: .38s; }
  body.on-cv .stage, body.on-cv .count { opacity: 0; pointer-events: none; }

  @media (prefers-reduced-motion: reduce) {
    .photo, .print, .photo img { transition: none; }
    .photo img.dev { animation-duration: .01s; }
  }
</style>
</head>
<body>
<header class="head">
  <a href="#" class="name">KENTARO TSUJI</a>
  <a href="#cv" class="nav" id="nav">CV</a>
</header>

<main class="stage" id="stage" aria-roledescription="carousel" aria-label="Photographs">
  <figure class="print" id="print"><div class="photo" id="photo"></div></figure>
</main>
<div class="count" id="count" aria-live="polite"></div>

<section class="cv" id="cv" aria-label="CV">
  <div class="cv-inner">
    <h1>KENTARO TSUJI</h1>
    <p class="role">iPhone 1 Photographer</p>
    <ol>
      <li><span class="yr">1996</span><span>Born in Saga, Japan</span></li>
      <li><span class="yr">2021</span><span>M.Eng. in Systems and Control Engineering, Tokyo Institute of Technology</span></li>
      <li><span class="yr">2021</span><span>Joined Dentsu</span></li>
    </ol>
  </div>
</section>

<script>
  // Placeholder photos from Unsplash (swap these for your own images).
  const photos = [
    "1505765050516-f72dcac9c60e",
    "1494500764479-0c8f2919a3d8",
    "1482192596544-9eb780fc7f66",
    "1500530855697-b586d89ba3ee",
    "1470071459604-3b5ec3a7fe05",
    "1441974231531-c6227db76b6e",
    "1501785888041-af3ef285b470",
    "1519681393784-d120267933ba",
  ];
  const src = id => `https://images.unsplash.com/photo-${id}?auto=format&fit=max&w=2000&q=80`;

  const stage = document.getElementById('stage');
  const print = document.getElementById('print');
  const photo = document.getElementById('photo');
  const count = document.getElementById('count');
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  // ---- prints ----------------------------------------------------------------
  let index = 0;
  let imgs = photos.map(id => {
    const img = new Image();
    img.alt = '';
    img.decoding = 'async';
    img.src = src(id);
    img.addEventListener('animationend', () => img.classList.remove('dev'));
    img.onload = () => { if (img === imgs[index]) fit(); };
    img.onerror = () => {
      const was = imgs[index];
      img.remove(); imgs = imgs.filter(i => i !== img);
      index = Math.max(0, imgs.indexOf(was)); show(index, true);
    };
    photo.appendChild(img);
    return img;
  });

  // size the window of the frame to the photo's own proportions
  function fit() {
    const img = imgs[index];
    if (!img || !img.naturalWidth) return;
    const cs = getComputedStyle(stage), pr = getComputedStyle(print);
    const pad = parseFloat(pr.paddingLeft) * 2;
    const maxW = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - pad;
    const maxH = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - pad;
    const s = Math.min(maxW / img.naturalWidth, maxH / img.naturalHeight);
    photo.style.width = Math.round(img.naturalWidth * s) + 'px';
    photo.style.height = Math.round(img.naturalHeight * s) + 'px';
  }

  function show(i, instant) {
    const prev = imgs[index];
    index = clamp(i, 0, imgs.length - 1);
    const next = imgs[index];
    for (const img of imgs) if (img !== prev && img !== next) img.classList.remove('on', 'out', 'dev');
    if (prev && prev !== next) {
      prev.style.filter = '';
      prev.classList.remove('on', 'dev');
      prev.classList.add('out');
    }
    next.classList.remove('out');
    next.style.filter = '';
    if (!instant) { next.classList.remove('dev'); void next.offsetWidth; next.classList.add('dev'); }
    next.classList.add('on');
    fit();
    count.textContent = `${String(index + 1).padStart(2, '0')} / ${String(imgs.length).padStart(2, '0')}`;
  }
  function go(i) {
    if (i < 0 || i >= imgs.length || i === index) { nudge(i < index ? 1 : -1); return; }
    show(i);
  }
  function nudge(dir) {                       // at either end the print only shifts a hair
    print.style.transform = `translateX(${dir * 10}px)`;
    setTimeout(() => print.style.transform = '', 140);
  }

  // ---- drag: the print gives a little, and the photo fades under the light ---
  let drag = null;
  stage.addEventListener('pointerdown', e => {
    if (e.button !== 0 || document.body.classList.contains('on-cv')) return;
    drag = { x0: e.clientX, y0: e.clientY, dx: 0, axis: null, t0: performance.now() };
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
    if (!drag.axis && Math.hypot(dx, dy) > 6) drag.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    if (drag.axis !== 'x') return;
    drag.dx = dx;
    stage.classList.add('dragging');
    const edge = (dx > 0 && index === 0) || (dx < 0 && index === imgs.length - 1);
    const p = clamp(Math.abs(dx) / (stage.clientWidth * 0.45), 0, 1) * (edge ? 0.25 : 1);
    const move = Math.sign(dx) * Math.pow(Math.abs(dx), 0.8) * (edge ? 0.25 : 0.45);
    print.style.transform = `translateX(${move}px) rotate(${move * 0.012}deg)`;
    const img = imgs[index];
    img.classList.remove('dev');
    img.style.filter = `brightness(${1 + p * 0.55}) contrast(${1 - p * 0.3}) saturate(${1 - p * 0.7}) sepia(0) blur(${p * 2.5}px)`;
  });
  function end(e) {
    if (!drag) return;
    stage.classList.remove('dragging');
    print.style.transform = '';
    const { dx, axis, t0 } = drag;
    drag = null;
    if (axis === 'x') {
      const fast = Math.abs(dx) / (performance.now() - t0) > 0.5 && Math.abs(dx) > 30;
      if (Math.abs(dx) > stage.clientWidth * 0.18 || fast) {
        const i = index + (dx < 0 ? 1 : -1);
        if (i >= 0 && i < imgs.length) { show(i); return; }
      }
      imgs[index].style.filter = '';             // not far enough: the photo comes back
    } else if (!axis && e.type === 'pointerup') {
      go(index + (e.clientX > innerWidth / 3 ? 1 : -1));
    }
  }
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);

  // ---- keyboard, wheel -------------------------------------------------------
  addEventListener('keydown', e => {
    if (document.body.classList.contains('on-cv')) { if (e.key === 'Escape') location.hash = ''; return; }
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); go(index + 1); }
    if (e.key === 'ArrowLeft') go(index - 1);
  });
  let wheelLock = false;
  addEventListener('wheel', e => {
    if (document.body.classList.contains('on-cv')) return;
    const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if (wheelLock || Math.abs(d) < 20) return;
    wheelLock = true; go(index + (d > 0 ? 1 : -1));
    setTimeout(() => wheelLock = false, 900);
  }, { passive: true });
  addEventListener('resize', fit);

  // ---- CV view (#cv) ---------------------------------------------------------
  const nav = document.getElementById('nav');
  function route() {
    const cv = location.hash === '#cv';
    document.body.classList.toggle('on-cv', cv);
    nav.textContent = cv ? 'CLOSE' : 'CV';
    nav.setAttribute('href', cv ? '#' : '#cv');
  }
  addEventListener('hashchange', route);
  route();

  show(0, true);
  imgs[0].classList.add('dev');
</script>
</body>
</html>
