<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kentaro Tsuji</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: one framed print at a time on a horizontal rail; the print leaving the frame frays into fine dust. */
  :root {
    --bg: #e8e6e1;
    --frame: #ffffff;
    --ink: #2c2b28;
    --muted: #7a766f;
    --faint: #aaa69f;
    --rule: #cfccc5;
    --shadow: 30, 26, 20;
    --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
    --pad: clamp(12px, 2.4vmin, 28px);   /* white frame width */
    --gutter: clamp(28px, 8vmin, 88px);  /* space around the print */
    --head: 64px;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #1d1c1a; --ink: #e6e3dd; --muted: #8c8880; --faint: #66635d; --rule: #3a3834; --shadow: 0, 0, 0; color-scheme: dark } }
  :root[data-theme="dark"] {
    --bg: #1d1c1a; --ink: #e6e3dd; --muted: #8c8880; --faint: #66635d; --rule: #3a3834; --shadow: 0, 0, 0; color-scheme: dark }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 400 12px/1.5 var(--sans);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  a { color: inherit; text-decoration: none; }
  a:focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; }

  /* ---- header ---- */
  .head {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; justify-content: space-between; align-items: center;
    height: calc(var(--head) + env(safe-area-inset-top, 0px));
    padding-top: env(safe-area-inset-top, 0px);
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
    font-size: 11px; font-weight: 500; letter-spacing: .2em;
    color: var(--faint);
  }
  .head a { padding: 8px 0; transition: color .2s; }
  .head a:hover { color: var(--muted); }

  /* ---- photo rail ---- */
  .stage {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    padding: max(var(--gutter), calc(var(--head) + env(safe-area-inset-top, 0px))) var(--gutter) calc(var(--gutter) + 16px);
    overflow: hidden;
    touch-action: pan-y;
    cursor: grab;
    -webkit-user-select: none; user-select: none;
    transition: opacity .5s ease;
  }
  .stage.dragging { cursor: grabbing; }
  .print {
    grid-area: 1 / 1;
    background: var(--frame);
    padding: var(--pad);
    line-height: 0;
    box-shadow: 0 1px 2px rgba(var(--shadow), .08), 0 12px 34px -14px rgba(var(--shadow), .3);
    will-change: transform;
    opacity: 0;
    transition: opacity .6s ease;
  }
  .print.ready { opacity: 1; }
  .print img {
    display: block;
    max-width: calc(100vw - 2 * var(--gutter) - 2 * var(--pad));
    max-height: calc(100dvh - max(var(--gutter), calc(var(--head) + env(safe-area-inset-top, 0px))) - var(--gutter) - 16px - 2 * var(--pad));
    width: auto; height: auto;
    pointer-events: none; -webkit-user-drag: none;
  }
  .dust { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; transition: opacity .5s ease; }
  .count {
    position: fixed; left: 0; right: 0;
    bottom: max(calc(var(--gutter) / 2 - 4px), env(safe-area-inset-bottom, 0px));
    text-align: center; pointer-events: none;
    font-size: 11px; letter-spacing: .14em; color: var(--faint);
    font-variant-numeric: tabular-nums;
    transition: opacity .5s ease;
  }

  /* ---- CV ---- */
  .cv {
    position: fixed; inset: 0; z-index: 5;
    overflow-y: auto;
    padding-top: calc(var(--head) + env(safe-area-inset-top, 0px) + clamp(48px, 14vh, 140px));
    padding-bottom: 80px;
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
    background: var(--bg);
    opacity: 0; visibility: hidden;
    transition: opacity .5s ease, visibility 0s linear .5s;
  }
  .cv-inner { max-width: 620px; margin: 0 auto; }
  .cv h1 { font-size: 13px; font-weight: 500; letter-spacing: .2em; }
  .cv .role { margin-top: 10px; color: var(--muted); font-size: 13px; letter-spacing: .02em; }
  .cv ol { list-style: none; margin-top: 56px; border-top: 1px solid var(--rule); }
  .cv li {
    display: grid; grid-template-columns: 4.5em 1fr; gap: 16px;
    padding: 16px 0; border-bottom: 1px solid var(--rule);
    font-size: 13px; line-height: 1.6;
  }
  .cv li > * { min-width: 0; }
  .cv .yr { color: var(--muted); font-variant-numeric: tabular-nums; }
  .cv li, .cv h1, .cv .role { opacity: 0; transform: translateY(6px); transition: opacity .6s ease, transform .6s ease; }

  body.on-cv .cv { opacity: 1; visibility: visible; transition: opacity .5s ease; }
  body.on-cv .cv li, body.on-cv .cv h1, body.on-cv .cv .role { opacity: 1; transform: none; }
  body.on-cv .cv h1 { transition-delay: .1s; }
  body.on-cv .cv .role { transition-delay: .18s; }
  body.on-cv .cv li:nth-child(1) { transition-delay: .26s; }
  body.on-cv .cv li:nth-child(2) { transition-delay: .32s; }
  body.on-cv .cv li:nth-child(3) { transition-delay: .38s; }
  body.on-cv .stage, body.on-cv .count, body.on-cv .dust { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<header class="head">
  <a href="#" class="name">KENTARO TSUJI</a>
  <a href="#cv" class="nav" id="nav">CV</a>
</header>

<main class="stage" id="stage" aria-roledescription="carousel" aria-label="Photographs"></main>
<canvas class="dust" id="dust"></canvas>
<div class="count" id="count" aria-live="polite"></div>

<section class="cv" id="cv" aria-label="CV">
  <div class="cv-inner">
    <h1>KENTARO TSUJI</h1>
    <p class="role">iPhone 1 Photographer</p>
    <ol>
      <li><span class="yr">1996</span><span>Born in Saga, Japan</span></li>
      <li><span class="yr">2021</span><span>M.Eng. in Systems and Control Engineering, Tokyo Institute of Technology</span></li>
      <li><span class="yr">2021</span><span>Joined Dentsu</span></li>
    </ol>
  </div>
</section>

<script>
  // Placeholder photos from Unsplash (swap these for your own images).
  const photos = [
    "1505765050516-f72dcac9c60e",
    "1494500764479-0c8f2919a3d8",
    "1482192596544-9eb780fc7f66",
    "1500530855697-b586d89ba3ee",
    "1470071459604-3b5ec3a7fe05",
    "1441974231531-c6227db76b6e",
    "1501785888041-af3ef285b470",
    "1519681393784-d120267933ba",
  ];
  const src = id => `https://images.unsplash.com/photo-${id}?auto=format&fit=max&w=2000&q=80`;

  const stage = document.getElementById('stage');
  const count = document.getElementById('count');
  const dust = document.getElementById('dust');
  const ctx = dust.getContext('2d');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const onCV = () => document.body.classList.contains('on-cv');

  // ---- prints ----------------------------------------------------------------
  let prints = photos.map(id => {
    const el = document.createElement('figure');
    el.className = 'print';
    const img = new Image();
    img.alt = '';
    img.decoding = 'async';
    el.appendChild(img);
    stage.appendChild(el);
    const p = { el, img, w: 0, loaded: false };
    img.onload = () => { p.loaded = true; el.classList.add('ready'); measure(); };
    img.onerror = () => { el.remove(); prints = prints.filter(q => q !== p); index = clamp(index, 0, prints.length - 1); pos = target = index; measure(); };
    img.src = src(id);
    return p;
  });

  // ---- rail state: pos is a continuous "which photo" (1.5 = halfway from 2nd to 3rd)
  let index = 0, pos = 0, vel = 0, target = 0;
  let S = 600;                                   // px between neighbouring prints
  function measure() {
    let maxW = 0;
    for (const p of prints) { p.w = p.el.offsetWidth; maxW = Math.max(maxW, p.w); }
    S = stage.clientWidth / 2 + maxW / 2 + 48;   // a neighbour waits just off screen
    setCount();
    render();
  }
  function setCount() {
    count.textContent = `${String(index + 1).padStart(2, '0')} / ${String(prints.length).padStart(2, '0')}`;
  }

  // ---- dust: the print that is leaving frays from its outer edge -------------
  // Grain state is a pure function of how far the print is from centre, so it
  // follows the finger both ways and reassembles if you bring the print back.
  let leaving = null;                            // { p, sheet, rect, cell, dpr, cols }
  const LIFE = 0.32;                             // share of the slide one grain takes to drift away

  function sizeCanvas() {
    const dpr = Math.min(2, devicePixelRatio || 1);
    dust.width = Math.round(innerWidth * dpr); dust.height = Math.round(innerHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function prepare(p) {                          // cut the print into fine grains
    if (reduced || !p || !p.loaded) { leaving = null; return; }
    if (leaving && leaving.p === p) return;
    const prevT = p.el.style.transform; p.el.style.transform = '';
    const r = p.el.getBoundingClientRect();
    const ir = p.img.getBoundingClientRect();
    p.el.style.transform = prevT;
    const dpr = Math.min(2, devicePixelRatio || 1);
    const sheet = document.createElement('canvas');
    sheet.width = Math.round(r.width * dpr); sheet.height = Math.round(r.height * dpr);
    const sc = sheet.getContext('2d');
    sc.scale(dpr, dpr);
    sc.fillStyle = getComputedStyle(p.el).backgroundColor;
    sc.fillRect(0, 0, r.width, r.height);
    sc.drawImage(p.img, ir.left - r.left, ir.top - r.top, ir.width, ir.height);
    const cell = clamp(Math.round(Math.sqrt(r.width * r.height / 18000)), 2, 4);
    const cols = [];
    for (let x = 0; x < r.width; x += cell) {
      const col = { x, u: x / r.width, grains: [] };
      for (let y = 0; y < r.height; y += cell) {
        col.grains.push({
          y, r: Math.random(),
          dx: 10 + Math.random() * 46,
          dy: -6 - Math.random() * 34 + (y / r.height - 0.5) * 14,
          wob: Math.random() * 6.28,
        });
      }
      cols.push(col);
    }
    leaving = { p, sheet, rect: { left: r.left, top: r.top, width: r.width, height: r.height }, cell, dpr, cols };
  }

  function drawDust() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    const L = leaving;
    if (!L) return;
    const i = prints.indexOf(L.p);
    const d = i - pos;
    const a = Math.abs(d);
    if (a < 0.0015) { L.p.el.style.visibility = ''; return; }
    L.p.el.style.visibility = 'hidden';
    const side = d < 0 ? -1 : 1;                 // which way it is sliding out
    const ox = L.rect.left + d * S, oy = L.rect.top;
    const { sheet, cell, dpr, rect } = L;
    const k = a * 1.3;                           // the fraying front
    const reach = k / 0.86;                      // beyond this, nothing has started to fray
    // the untouched part of the print, in one piece
    const cut = side < 0 ? rect.width * Math.min(1, reach) : rect.width * (1 - Math.min(1, reach));
    ctx.globalAlpha = 1;
    if (side < 0 && cut < rect.width) {
      const x0 = Math.floor(cut / cell) * cell;
      ctx.drawImage(sheet, x0 * dpr, 0, (rect.width - x0) * dpr, rect.height * dpr, ox + x0, oy, rect.width - x0, rect.height);
    } else if (side > 0 && cut > 0) {
      const x1 = Math.ceil(cut / cell) * cell;
      ctx.drawImage(sheet, 0, 0, x1 * dpr, rect.height * dpr, ox, oy, x1, rect.height);
    }
    // the fraying band, grain by grain
    const sw = cell * dpr;
    for (const col of L.cols) {
      const lead = side < 0 ? col.u : 1 - col.u; // 0 at the outer edge
      if (lead > reach) continue;
      for (const g of col.grains) {
        const delay = lead * 0.86 + g.r * 0.14;
        const t = clamp((k - delay) / LIFE, 0, 1);
        if (t >= 1) continue;
        if (t <= 0) {
          ctx.globalAlpha = 1;
          ctx.drawImage(sheet, col.x * dpr, g.y * dpr, sw, sw, ox + col.x, oy + g.y, cell + 0.5, cell + 0.5);
          continue;
        }
        const e = t * t;
        const x = ox + col.x + side * g.dx * e + Math.sin(g.wob + t * 4) * 3 * t;
        const y = oy + g.y + g.dy * e;
        const s = cell * (1 - 0.5 * t);
        ctx.globalAlpha = 1 - t;
        ctx.drawImage(sheet, col.x * dpr, g.y * dpr, sw, sw, x, y, s, s);
      }
    }
    ctx.globalAlpha = 1;
  }

  function render() {
    prints.forEach((p, i) => {
      const d = i - pos;
      p.el.style.visibility = Math.abs(d) > 1.6 ? 'hidden' : '';
      p.el.style.transform = `translate3d(${d * S}px,0,0)`;
    });
    drawDust();
  }

  // ---- spring ------------------------------------------------------------------
  const K = reduced ? 900 : 180, D = reduced ? 60 : 25;   // just under critical: settles with no bounce you can see
  let raf = 0, last = 0, holding = false;
  function wake() { if (!raf) { last = performance.now(); raf = requestAnimationFrame(tick); } }
  function tick(now) {
    const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
    if (!holding) {
      vel += (-K * (pos - target) - D * vel) * dt;
      pos += vel * dt;
      if (Math.abs(pos - target) < 0.0004 && Math.abs(vel) < 0.002) {
        pos = target; vel = 0; render();
        if (leaving) { leaving.p.el.style.visibility = ''; leaving = null; drawDust(); }
        raf = 0; return;
      }
    }
    render();
    raf = requestAnimationFrame(tick);
  }
  function go(i, kick = 0) {
    if (i < 0 || i >= prints.length) kick += (i < 0 ? -1 : 1) * 0.9;   // the end of the rail: a soft bump
    const from = Math.round(pos);
    index = clamp(i, 0, prints.length - 1);
    if (index !== from) prepare(prints[from]);
    target = index;
    vel += kick;
    setCount();
    wake();
  }

  // ---- drag: 1:1 with the finger, then the flick carries on into the spring --------
  let drag = null;
  stage.addEventListener('pointerdown', e => {
    if (e.button !== 0 || onCV()) return;
    drag = { x0: e.clientX, y0: e.clientY, axis: null, p0: pos, hist: [{ x: e.clientX, t: performance.now() }] };
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
    if (!drag.axis && Math.hypot(dx, dy) > 5) {
      drag.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
      if (drag.axis === 'x') { drag.x0 = e.clientX; drag.p0 = pos; prepare(prints[Math.round(pos)]); }
    }
    if (drag.axis !== 'x') return;
    holding = true; vel = 0;
    stage.classList.add('dragging');
    drag.hist.push({ x: e.clientX, t: performance.now() });
    if (drag.hist.length > 5) drag.hist.shift();
    let p = drag.p0 - (e.clientX - drag.x0) / S;
    const hi = prints.length - 1;                // past either end the rail goes stiff
    if (p < 0) p = -rubber(-p);
    if (p > hi) p = hi + rubber(p - hi);
    pos = p;
    wake();
  });
  const rubber = o => 0.18 * (1 - Math.exp(-o / 0.18 * 0.55));

  function end(e) {
    if (!drag) return;
    stage.classList.remove('dragging');
    const { axis, hist, p0 } = drag;
    drag = null;
    if (axis === 'x') {
      holding = false;
      const a = hist[0], b = hist[hist.length - 1];
      const v = (b.x - a.x) / Math.max(12, b.t - a.t);        // px per ms, + = finger moving right
      vel = -v * 1000 / S;                                   // hand the finger's speed to the spring
      const from = Math.round(p0);
      const projected = pos + vel * 0.16;                    // where the flick would carry it
      const i = clamp(Math.round(projected), from - 1, from + 1);   // one photo per flick
      index = clamp(i, 0, prints.length - 1);
      target = index;
      setCount();
      wake();
    } else if (!axis && e.type === 'pointerup') {
      go(index + (e.clientX > innerWidth / 3 ? 1 : -1));
    }
  }
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);

  // ---- keyboard, wheel -------------------------------------------------------
  addEventListener('keydown', e => {
    if (onCV()) { if (e.key === 'Escape') location.hash = ''; return; }
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); go(index + 1); }
    if (e.key === 'ArrowLeft') go(index - 1);
  });
  let wheelLock = false;
  addEventListener('wheel', e => {
    if (onCV()) return;
    const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if (wheelLock || Math.abs(d) < 20) return;
    wheelLock = true; go(index + (d > 0 ? 1 : -1));
    setTimeout(() => wheelLock = false, 650);
  }, { passive: true });
  addEventListener('resize', () => { sizeCanvas(); leaving = null; measure(); });

  // ---- CV view (#cv) ---------------------------------------------------------
  const nav = document.getElementById('nav');
  function route() {
    const cv = location.hash === '#cv';
    document.body.classList.toggle('on-cv', cv);
    nav.textContent = cv ? 'CLOSE' : 'CV';
    nav.setAttribute('href', cv ? '#' : '#cv');
  }
  addEventListener('hashchange', route);
  route();

  sizeCanvas();
  measure();
</script>
</body>
</html>
