<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kentaro Tsuji</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: one framed print, centered; swiping it away breaks it into dust that drifts off. */
  :root {
    --bg: #e8e6e1;
    --frame: #ffffff;
    --ink: #2c2b28;
    --muted: #7a766f;
    --faint: #aaa69f;
    --rule: #cfccc5;
    --shadow: 30, 26, 20;
    --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
    --pad: clamp(12px, 2.4vmin, 28px);   /* white frame width */
    --gutter: clamp(28px, 8vmin, 88px);  /* space around the print */
    --head: 64px;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #1d1c1a; --ink: #e6e3dd; --muted: #8c8880; --faint: #66635d; --rule: #3a3834; --shadow: 0, 0, 0; color-scheme: dark } }
  :root[data-theme="dark"] {
    --bg: #1d1c1a; --ink: #e6e3dd; --muted: #8c8880; --faint: #66635d; --rule: #3a3834; --shadow: 0, 0, 0; color-scheme: dark }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 400 12px/1.5 var(--sans);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  a { color: inherit; text-decoration: none; }
  a:focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; }

  /* ---- header ---- */
  .head {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; justify-content: space-between; align-items: center;
    height: calc(var(--head) + env(safe-area-inset-top, 0px));
    padding-top: env(safe-area-inset-top, 0px);
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
    font-size: 11px; font-weight: 500; letter-spacing: .2em;
    color: var(--faint);
  }
  .head a { padding: 8px 0; transition: color .2s; }
  .head a:hover { color: var(--muted); }

  /* ---- photo ---- */
  .stage {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    padding: max(var(--gutter), calc(var(--head) + env(safe-area-inset-top, 0px))) var(--gutter) calc(var(--gutter) + 16px);
    overflow: hidden;
    touch-action: pan-y;
    cursor: grab;
    -webkit-user-select: none; user-select: none;
    transition: opacity .5s ease;
  }
  .stage.dragging { cursor: grabbing; }
  .print {
    grid-area: 1 / 1;
    background: var(--frame);
    padding: var(--pad);
    line-height: 0;
    box-shadow: 0 1px 2px rgba(var(--shadow), .08), 0 12px 34px -14px rgba(var(--shadow), .3);
    opacity: 0;
    visibility: hidden;
  }
  .print img {
    display: block;
    max-width: calc(100vw - 2 * var(--gutter) - 2 * var(--pad));
    max-height: calc(100dvh - max(var(--gutter), calc(var(--head) + env(safe-area-inset-top, 0px))) - var(--gutter) - 16px - 2 * var(--pad));
    width: auto; height: auto;
    pointer-events: none; -webkit-user-drag: none;
  }
  .dust { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
  .count {
    position: fixed; left: 0; right: 0;
    bottom: max(calc(var(--gutter) / 2 - 4px), env(safe-area-inset-bottom, 0px));
    text-align: center; pointer-events: none;
    font-size: 11px; letter-spacing: .14em; color: var(--faint);
    font-variant-numeric: tabular-nums;
    transition: opacity .5s ease;
  }

  /* ---- CV ---- */
  .cv {
    position: fixed; inset: 0; z-index: 5;
    overflow-y: auto;
    padding-top: calc(var(--head) + env(safe-area-inset-top, 0px) + clamp(48px, 14vh, 140px));
    padding-bottom: 80px;
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
    background: var(--bg);
    opacity: 0; visibility: hidden;
    transition: opacity .5s ease, visibility 0s linear .5s;
  }
  .cv-inner { max-width: 620px; margin: 0 auto; }
  .cv h1 { font-size: 13px; font-weight: 500; letter-spacing: .2em; }
  .cv .role { margin-top: 10px; color: var(--muted); font-size: 13px; letter-spacing: .02em; }
  .cv ol { list-style: none; margin-top: 56px; border-top: 1px solid var(--rule); }
  .cv li {
    display: grid; grid-template-columns: 4.5em 1fr; gap: 16px;
    padding: 16px 0; border-bottom: 1px solid var(--rule);
    font-size: 13px; line-height: 1.6;
  }
  .cv li > * { min-width: 0; }
  .cv .yr { color: var(--muted); font-variant-numeric: tabular-nums; }
  .cv li, .cv h1, .cv .role { opacity: 0; transform: translateY(6px); transition: opacity .6s ease, transform .6s ease; }

  body.on-cv .cv { opacity: 1; visibility: visible; transition: opacity .5s ease; }
  body.on-cv .cv li, body.on-cv .cv h1, body.on-cv .cv .role { opacity: 1; transform: none; }
  body.on-cv .cv h1 { transition-delay: .1s; }
  body.on-cv .cv .role { transition-delay: .18s; }
  body.on-cv .cv li:nth-child(1) { transition-delay: .26s; }
  body.on-cv .cv li:nth-child(2) { transition-delay: .32s; }
  body.on-cv .cv li:nth-child(3) { transition-delay: .38s; }
  body.on-cv .stage, body.on-cv .count, body.on-cv .dust { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<header class="head">
  <a href="#" class="name">KENTARO TSUJI</a>
  <a href="#cv" class="nav" id="nav">CV</a>
</header>

<main class="stage" id="stage" aria-roledescription="carousel" aria-label="Photographs"></main>
<canvas class="dust" id="dust"></canvas>
<div class="count" id="count" aria-live="polite"></div>

<section class="cv" id="cv" aria-label="CV">
  <div class="cv-inner">
    <h1>KENTARO TSUJI</h1>
    <p class="role">iPhone 1 Photographer</p>
    <ol>
      <li><span class="yr">1996</span><span>Born in Saga, Japan</span></li>
      <li><span class="yr">2021</span><span>M.Eng. in Systems and Control Engineering, Tokyo Institute of Technology</span></li>
      <li><span class="yr">2021</span><span>Joined Dentsu</span></li>
    </ol>
  </div>
</section>

<script>
  // Placeholder photos from Unsplash (swap these for your own images).
  const photos = [
    "1505765050516-f72dcac9c60e",
    "1494500764479-0c8f2919a3d8",
    "1482192596544-9eb780fc7f66",
    "1500530855697-b586d89ba3ee",
    "1470071459604-3b5ec3a7fe05",
    "1441974231531-c6227db76b6e",
    "1501785888041-af3ef285b470",
    "1519681393784-d120267933ba",
  ];
  const src = id => `https://images.unsplash.com/photo-${id}?auto=format&fit=max&w=2000&q=80`;

  const stage = document.getElementById('stage');
  const count = document.getElementById('count');
  const dust = document.getElementById('dust');
  const ctx = dust.getContext('2d');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const onCV = () => document.body.classList.contains('on-cv');

  // ---- prints ----------------------------------------------------------------
  let index = 0;
  let prints = photos.map(id => {
    const el = document.createElement('figure');
    el.className = 'print';
    const img = new Image();
    img.alt = '';
    img.decoding = 'async';
    el.appendChild(img);
    stage.appendChild(el);
    const p = { el, img, loaded: false };
    img.onload = () => { p.loaded = true; paint(); };
    img.onerror = () => { el.remove(); prints = prints.filter(q => q !== p); index = clamp(index, 0, prints.length - 1); setCount(); paint(); };
    img.src = src(id);
    return p;
  });
  function setCount(i = index) {
    count.textContent = `${String(i + 1).padStart(2, '0')} / ${String(prints.length).padStart(2, '0')}`;
  }

  // ---- dust ------------------------------------------------------------------
  // g is the progress of one print turning to dust: 0 whole .. 1 gone.
  // Every grain's position is a pure function of g, so the effect can be scrubbed both ways.
  let g = 0, run = null;                     // run: { from, to, dir, grains, sheet, rect }
  const LIFE = 0.5;                          // how much of g one grain takes to fly off

  function sizeCanvas() {
    const dpr = Math.min(2, devicePixelRatio || 1);
    dust.width = Math.round(innerWidth * dpr); dust.height = Math.round(innerHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function crumble(to, dir) {
    const from = prints[index];
    const r = from.el.getBoundingClientRect();
    // a flat copy of the print (frame + photo) to cut grains from
    const dpr = Math.min(2, devicePixelRatio || 1);
    const sheet = document.createElement('canvas');
    sheet.width = Math.round(r.width * dpr); sheet.height = Math.round(r.height * dpr);
    const sc = sheet.getContext('2d');
    sc.scale(dpr, dpr);
    sc.fillStyle = getComputedStyle(from.el).backgroundColor;
    sc.fillRect(0, 0, r.width, r.height);
    const ir = from.img.getBoundingClientRect();
    if (from.loaded) sc.drawImage(from.img, ir.left - r.left, ir.top - r.top, ir.width, ir.height);

    const cell = clamp(Math.round(Math.sqrt(r.width * r.height / 5200)), 3, 9);
    const grains = [];
    for (let y = 0; y < r.height; y += cell) {
      for (let x = 0; x < r.width; x += cell) {
        const u = x / r.width, v = y / r.height;
        const lead = dir < 0 ? u : 1 - u;               // the edge the wind reaches first
        grains.push({
          x, y,
          delay: lead * (1 - LIFE) * 0.82 + Math.random() * (1 - LIFE) * 0.18 + (Math.abs(v - 0.5) * 0.04),
          vx: (90 + Math.random() * 260) * (0.6 + 0.4 * (1 - lead)),
          vy: -30 - Math.random() * 110 + (v - 0.5) * 60,
          lift: 20 + Math.random() * 70,
          wob: Math.random() * 6.28, wa: 4 + Math.random() * 10,
          spin: Math.random(),
        });
      }
    }
    from.el.style.visibility = 'hidden';
    run = { from, to, dir, grains, sheet, rect: r, cell, dpr };
  }

  function drawDust() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    if (!run) return;
    const { grains, sheet, rect, cell, dir, dpr } = run;
    const sw = cell * dpr;
    for (const p of grains) {
      const t = clamp((g - p.delay) / LIFE, 0, 1);
      if (t >= 1) continue;
      if (t <= 0) {                                      // still part of the print (a hair oversized: no seams)
        ctx.globalAlpha = 1;
        ctx.drawImage(sheet, p.x * dpr, p.y * dpr, sw, sw, rect.left + p.x, rect.top + p.y, cell + 0.6, cell + 0.6);
        continue;
      }
      const e = t * t * (1.6 - 0.6 * t);                 // grains pick up speed as the wind takes them
      const x = rect.left + p.x + dir * p.vx * e + Math.sin(p.wob + t * 5) * p.wa * t;
      const y = rect.top + p.y + p.vy * e - p.lift * t * t;
      const s = cell * (1 - 0.65 * t);
      ctx.globalAlpha = Math.pow(1 - t, 1.3);
      ctx.drawImage(sheet, p.x * dpr, p.y * dpr, sw, sw, x, y, s, s);
    }
    ctx.globalAlpha = 1;
  }

  // what the DOM shows, given g
  function paint() {
    prints.forEach((p, i) => {
      let o = 0;
      if (run) {
        if (p === run.to) o = smooth(0.25, 0.95, g);       // the next print comes up as the dust clears
        if (p === run.from) o = 1;                          // (hidden: its grains are drawn instead)
      } else if (i === index) o = 1;
      p.el.style.opacity = p.loaded ? o : 0;
      if (!run || p !== run.from) p.el.style.visibility = o > 0 ? 'visible' : 'hidden';
      p.el.style.transform = run && p === run.to ? `scale(${0.985 + 0.015 * smooth(0.25, 1, g)})` : '';
    });
    drawDust();
  }

  // ---- animation ---------------------------------------------------------------
  let anim = 0;
  function tween(to, ms, done) {
    cancelAnimationFrame(anim);
    const g0 = g, t0 = performance.now();
    const step = now => {
      const k = clamp((now - t0) / ms, 0, 1);
      const e = to > g0 ? 1 - Math.pow(1 - k, 1.6) : 1 - Math.pow(1 - k, 3);
      g = g0 + (to - g0) * e;
      paint();
      if (k < 1) anim = requestAnimationFrame(step); else { anim = 0; done && done(); }
    };
    anim = requestAnimationFrame(step);
  }
  function finish() {                                        // the old print is gone: settle on the new one
    index = prints.indexOf(run.to);
    run.from.el.style.visibility = '';
    run = null; g = 0;
    setCount(); paint();
  }
  function restore() {                                       // the dust came back together
    run.from.el.style.visibility = '';
    run = null; g = 0;
    paint();
  }
  function go(i) {
    if (run || i < 0 || i >= prints.length || i === index) return;
    if (reduced) { index = i; setCount(); paint(); return; }
    crumble(prints[i], i > index ? -1 : 1);
    setCount(i);
    tween(1, 1500, finish);
  }

  // ---- drag: the print comes apart under your finger ---------------------------
  let drag = null;
  stage.addEventListener('pointerdown', e => {
    if (e.button !== 0 || onCV() || run) return;
    drag = { x0: e.clientX, y0: e.clientY, axis: null, hist: [{ x: e.clientX, t: performance.now() }] };
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
    if (!drag.axis && Math.hypot(dx, dy) > 6) {
      drag.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
      if (drag.axis === 'x') {
        const dir = dx < 0 ? -1 : 1;
        const i = index + (dx < 0 ? 1 : -1);
        drag.end = i < 0 || i >= prints.length;               // nothing beyond: only the edge frays
        crumble(drag.end ? null : prints[i], dir);
        drag.dir = dir;
      }
    }
    if (drag.axis !== 'x') return;
    stage.classList.add('dragging');
    drag.hist.push({ x: e.clientX, t: performance.now() });
    if (drag.hist.length > 5) drag.hist.shift();
    const along = Math.max(0, dx * drag.dir);                 // only movement in the starting direction counts
    const q = along / (Math.min(innerWidth, 1000) * 0.75);
    g = drag.end ? 0.12 * (1 - Math.exp(-q / 0.12)) : 0.72 * (1 - Math.exp(-q / 0.6));
    paint();
  });
  function end(e) {
    if (!drag) return;
    stage.classList.remove('dragging');
    const { axis, hist, dir } = drag;
    const ended = drag.end;
    drag = null;
    if (axis === 'x' && run) {
      const a = hist[0], b = hist[hist.length - 1];
      const v = ((b.x - a.x) / Math.max(12, b.t - a.t)) * dir;   // speed in the swipe direction
      if (!ended && (g > 0.22 || v > 0.4)) { setCount(prints.indexOf(run.to)); tween(1, 1300 * (1 - g * 0.5), finish); }
      else tween(0, 520, restore);                              // let go early: the grains fly home
    } else if (!axis && e.type === 'pointerup') {
      go(index + (e.clientX > innerWidth / 3 ? 1 : -1));
    }
  }
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);

  // ---- keyboard, wheel -------------------------------------------------------
  addEventListener('keydown', e => {
    if (onCV()) { if (e.key === 'Escape') location.hash = ''; return; }
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); go(index + 1); }
    if (e.key === 'ArrowLeft') go(index - 1);
  });
  let wheelLock = false;
  addEventListener('wheel', e => {
    if (onCV()) return;
    const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if (wheelLock || Math.abs(d) < 20) return;
    wheelLock = true; go(index + (d > 0 ? 1 : -1));
    setTimeout(() => wheelLock = false, 900);
  }, { passive: true });
  addEventListener('resize', () => { sizeCanvas(); paint(); });

  // ---- CV view (#cv) ---------------------------------------------------------
  const nav = document.getElementById('nav');
  function route() {
    const cv = location.hash === '#cv';
    document.body.classList.toggle('on-cv', cv);
    nav.textContent = cv ? 'CLOSE' : 'CV';
    nav.setAttribute('href', cv ? '#' : '#cv');
  }
  addEventListener('hashchange', route);
  route();

  sizeCanvas();
  setCount();
  paint();
</script>
</body>
</html>
