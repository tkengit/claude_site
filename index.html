<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>One Print</title>
<style>
  /* Layout: one print at a time; turning it curls the paper around a cylinder, like a page. */
  :root {
    --bg: #e8e6e1;
    --frame: #ffffff;
    --paper-back: #f3f1ec;
    --ink: #6b6862;
    --shadow: 30, 26, 20;
    --pad: clamp(12px, 2.4vmin, 28px);   /* white frame width */
    --gutter: clamp(28px, 8vmin, 88px);  /* space around the print */
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1d1c1a; --ink: #8c8880; --paper-back: #e9e6e0; --shadow: 0, 0, 0; color-scheme: dark } }
  :root[data-theme="dark"] { --bg: #1d1c1a; --ink: #8c8880; --paper-back: #e9e6e0; --shadow: 0, 0, 0; color-scheme: dark }

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 11px/1 ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: .12em;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .stage {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    padding: var(--gutter) var(--gutter) calc(var(--gutter) + 16px);
    overflow: hidden;
    touch-action: pan-y;
    cursor: grab;
  }
  .stage.dragging { cursor: grabbing; }

  .card {
    grid-area: 1 / 1;
    position: relative;
    perspective: 1800px;
    opacity: 0;
    transition: opacity .45s ease;
  }
  .sheet {
    background: var(--frame);
    padding: var(--pad);
    line-height: 0;
    box-shadow:
      0 1px 2px rgba(var(--shadow), .08),
      0 10px 30px -14px rgba(var(--shadow), .28);
  }
  .sheet img {
    display: block;
    max-width: calc(100vw - 2 * var(--gutter) - 2 * var(--pad));
    max-height: calc(100dvh - 2 * var(--gutter) - 16px - 2 * var(--pad));
    width: auto; height: auto;
    pointer-events: none;
    -webkit-user-drag: none;
  }
  .card.curling > .sheet { visibility: hidden; }

  /* the curling paper: thin vertical strips laid along a cylinder */
  .curl { position: absolute; inset: 0; transform-style: preserve-3d; pointer-events: none; }
  .flat-shadow {
    position: absolute; top: 0; bottom: 0; left: 0;
    box-shadow: 0 1px 2px rgba(var(--shadow), .08), 0 10px 30px -14px rgba(var(--shadow), .28);
  }
  .cast {
    position: absolute; top: -2%; bottom: -2%; left: 0; width: 90px;
    background: linear-gradient(to right, rgba(var(--shadow), .32), rgba(var(--shadow), .1) 35%, rgba(var(--shadow), 0));
    filter: blur(3px);
    transform-origin: 0 50%;
  }
  .strip { position: absolute; top: 0; left: 0; height: 100%; transform-style: preserve-3d; transform-origin: 0 50%; }
  .face { position: absolute; inset: 0; overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .face.back { background: var(--paper-back); transform: rotateY(180deg); }
  .face .sheet { position: absolute; top: 0; box-shadow: none; }
  .shade, .gloss { position: absolute; inset: 0; opacity: 0; }
  .shade { background: rgb(var(--shadow)); }
  .gloss { background: #fff; mix-blend-mode: soft-light; }

  .count {
    position: fixed; left: 0; right: 0;
    bottom: max(calc(var(--gutter) / 2 - 4px), env(safe-area-inset-bottom));
    text-align: center; pointer-events: none;
    font-variant-numeric: tabular-nums;
  }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>
</head>
<body>
<main class="stage" id="stage" aria-roledescription="carousel"></main>
<div class="count" id="count" aria-live="polite"></div>

<script>
  // Placeholder photos from Unsplash (swap these for your own images).
  const photos = [
    "1505765050516-f72dcac9c60e",
    "1494500764479-0c8f2919a3d8",
    "1482192596544-9eb780fc7f66",
    "1500530855697-b586d89ba3ee",
    "1470071459604-3b5ec3a7fe05",
    "1441974231531-c6227db76b6e",
    "1501785888041-af3ef285b470",
    "1519681393784-d120267933ba",
  ];
  const src = id => `https://images.unsplash.com/photo-${id}?auto=format&fit=max&w=2000&q=80`;

  const stage = document.getElementById('stage');
  const count = document.getElementById('count');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const K = reduced ? 900 : 95;     // spring stiffness for the turn
  const D = reduced ? 60 : 17.5;    // damping (just under critical: the paper settles without bouncing)
  const PI = Math.PI;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

  // ---- cards: t = how far the page is turned (0 flat, 1 turned away) --------
  let index = 0;
  const cards = photos.map((id, i) => {
    const el = document.createElement('div');
    el.className = 'card';
    const sheet = document.createElement('figure');
    sheet.className = 'sheet';
    const img = new Image();
    img.alt = '';
    img.decoding = 'async';
    sheet.appendChild(img);
    el.appendChild(sheet);
    stage.appendChild(el);
    const c = { el, sheet, img, i, t: 0, vt: 0, tt: 0, held: false, loaded: false, curl: null };
    img.onload = () => { c.loaded = true; draw(c); };
    img.onerror = () => { el.remove(); cards.splice(cards.indexOf(c), 1); cards.forEach((k, j) => k.i = j);
                          index = clamp(index, 0, cards.length - 1); retarget(); };
    img.src = src(id);
    return c;
  });

  function retarget() {
    for (const c of cards) if (!c.held) c.tt = c.i < index ? 1 : 0;
    count.textContent = `${String(index + 1).padStart(2, '0')} / ${String(cards.length).padStart(2, '0')}`;
    wake();
  }

  // ---- the curl -------------------------------------------------------------
  function buildCurl(c) {
    const W = c.sheet.offsetWidth, H = c.sheet.offsetHeight;
    const n = clamp(Math.round(W / 9), 24, 72);
    const w = W / n;
    const curl = document.createElement('div');
    curl.className = 'curl';
    const flat = document.createElement('div'); flat.className = 'flat-shadow';
    const cast = document.createElement('div'); cast.className = 'cast';
    curl.append(cast, flat);
    const strips = [];
    for (let k = 0; k < n; k++) {
      const s = document.createElement('div');
      s.className = 'strip';
      s.style.width = (w + 1.2) + 'px';                 // a hair of overlap hides seams
      const front = document.createElement('div'); front.className = 'face';
      const copy = c.sheet.cloneNode(true);
      copy.style.left = (-k * w) + 'px';
      copy.style.width = W + 'px'; copy.style.height = H + 'px';
      const fs = document.createElement('div'); fs.className = 'shade';
      const fg = document.createElement('div'); fg.className = 'gloss';
      front.append(copy, fs, fg);
      const back = document.createElement('div'); back.className = 'face back';
      const bs = document.createElement('div'); bs.className = 'shade';
      back.append(bs);
      s.append(front, back);
      curl.appendChild(s);
      strips.push({ s, fs, fg, bs, u0: k * w });
    }
    c.el.appendChild(curl);
    c.el.classList.add('curling');
    c.curl = { curl, strips, flat, cast, W, H, w };
  }
  function dropCurl(c) {
    if (!c.curl) return;
    c.curl.curl.remove(); c.curl = null;
    c.el.classList.remove('curling');
  }

  function renderCurl(c) {
    const { strips, flat, cast, W } = c.curl;
    const t = clamp(c.t, -0.02, 1.04);
    // the paper loosens in the middle of the turn and tightens at the ends
    const Rb = clamp(W * 0.065, 14, 42);
    const R = Rb * (0.4 + 0.6 * smooth(0, 0.1, t)) * (1 + 0.3 * Math.sin(PI * clamp(t, 0, 1)));
    const fold = W - t * (W + PI * R);                   // where the paper leaves the wall
    for (const p of strips) {
      const u = p.u0 - fold;
      let x, z, a;
      if (u <= 0)            { x = p.u0; z = 0; a = 0; }
      else if (u <= PI * R)  { a = u / R; x = fold + R * Math.sin(a); z = R * (1 - Math.cos(a)); }
      else                   { a = PI; x = fold - (u - PI * R); z = 2 * R; }
      p.s.style.transform = `translate3d(${x}px,0,${z}px) rotateY(${-a}rad)`;
      // light from the front: darker as the paper turns away, a soft sheen near the crest
      p.fs.style.opacity = (0.42 * Math.pow(Math.max(0, 1 - Math.cos(Math.min(a, PI / 2))), 1.4)).toFixed(3);
      p.fg.style.opacity = (0.75 * Math.exp(-Math.pow((a - 0.55) / 0.32, 2))).toFixed(3);
      p.bs.style.opacity = (0.06 + 0.4 * Math.max(0, 1 + Math.cos(a)) ** 1.6).toFixed(3);
    }
    const edge = Math.max(0, fold) + (fold < W ? R : 0);  // rightmost point of the lifted paper
    flat.style.width = Math.max(0, Math.min(fold, W)) + 'px';
    cast.style.transform = `translateX(${Math.min(edge, W)}px) scaleX(${(0.4 + R / Rb * 0.6).toFixed(3)})`;
    cast.style.opacity = (smooth(0, 0.06, t) * (1 - smooth(0.55, 0.95, t))).toFixed(3);
  }

  function draw(c) {
    const d = c.i - index;
    const turning = c.held || (Math.abs(c.t) > 0.0008 && c.t < 0.999);
    if (turning && !c.curl && c.loaded) buildCurl(c);
    if (!turning && c.curl) dropCurl(c);
    if (c.curl) renderCurl(c);
    c.el.style.zIndex = 1000 - c.i;
    // the page underneath shows only while the one above it is being turned
    const above = cards[cards.indexOf(c) - 1];
    let op = 0;
    if (d < 0) op = 1 - smooth(0.82, 1, c.t);
    else if (d === 0) op = 1;
    else if (d === 1 && above && (above.t > 0.0008 || above.held)) op = 1;
    c.el.style.opacity = c.loaded ? op : 0;
    c.el.style.visibility = op > 0 || d === 0 ? 'visible' : 'hidden';
  }

  // ---- physics loop -----------------------------------------------------------
  let raf = 0, last = 0;
  function wake() { if (!raf) { last = performance.now(); raf = requestAnimationFrame(tick); } }
  function tick(now) {
    const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
    let moving = false;
    for (const c of cards) {
      if (!c.held) {
        c.vt += (-K * (c.t - c.tt) - D * c.vt) * dt;
        c.t += c.vt * dt;
        if (Math.abs(c.t - c.tt) < 0.0006 && Math.abs(c.vt) < 0.004) { c.t = c.tt; c.vt = 0; }
        else moving = true;
      } else moving = true;
    }
    cards.forEach(draw);
    raf = moving ? requestAnimationFrame(tick) : 0;
  }

  // ---- drag: lift the right edge and turn it, or pull the last page back -------
  let drag = null;
  stage.addEventListener('pointerdown', e => {
    if (e.button !== 0 || !cards.length) return;
    drag = { x0: e.clientX, y0: e.clientY, dx: 0, axis: null, mode: null,
             hist: [{ x: e.clientX, t: performance.now() }] };
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
    if (!drag.axis && Math.hypot(dx, dy) > 5) drag.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    if (drag.axis !== 'x') return;
    drag.dx = dx;
    drag.hist.push({ x: e.clientX, t: performance.now() });
    if (drag.hist.length > 6) drag.hist.shift();
    stage.classList.add('dragging');
    hold(dx > 0 && index > 0 ? 'prev' : 'next');
  });

  const span = c => (c.sheet.offsetWidth || 300) * 1.9;   // drag distance for a whole turn
  function hold(mode) {
    if (drag.mode && drag.mode !== mode) letGo(false);
    drag.mode = mode;
    const dx = drag.dx;
    if (mode === 'next') {
      const c = cards[index]; c.held = true;
      let t = Math.max(0, -dx) / span(c);
      if (index === cards.length - 1) t = 0.1 * (1 - Math.exp(-t / 0.1));   // last page: it lifts, then won't go
      c.t = t;
    } else {
      const c = cards[index - 1]; c.held = true;
      c.t = clamp(1 - dx / span(c), 0, 1);
    }
    wake();
  }

  function letGo(commit) {
    let v = 0;
    if (drag && drag.hist.length > 1) {
      const a = drag.hist[0], b = drag.hist[drag.hist.length - 1];
      v = (b.x - a.x) / Math.max(16, b.t - a.t);          // px per ms
    }
    for (const c of cards) {
      if (!c.held) continue;
      c.held = false;
      c.vt = -v * 1000 / span(c);
    }
    if (commit) {
      const { mode } = drag;
      if (mode === 'next' && index < cards.length - 1) {
        if (cards[index].t > 0.28 || v < -0.4) index++;
      } else if (mode === 'prev') {
        if (cards[index - 1].t < 0.78 || v > 0.4) index--;
      }
    }
    retarget();
  }

  function end(e) {
    if (!drag) return;
    stage.classList.remove('dragging');
    if (drag.axis === 'x') letGo(true);
    else if (!drag.axis && e.type === 'pointerup') e.clientX > innerWidth / 3 ? go(index + 1) : go(index - 1);
    drag = null;
  }
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);

  // ---- keyboard, wheel, tap -------------------------------------------------
  function go(i) {
    if (i >= cards.length) { cards[index].vt = 0.9; wake(); return; }   // a little lift: no more pages
    if (i < 0 || i === index) return;
    if (i > index) cards[index].vt = 0.6;
    else cards[i].vt = -0.6;
    index = i;
    retarget();
  }
  addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); go(index + 1); }
    if (e.key === 'ArrowLeft') go(index - 1);
  });
  let wheelLock = false;
  addEventListener('wheel', e => {
    const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if (wheelLock || Math.abs(d) < 20) return;
    wheelLock = true; go(index + (d > 0 ? 1 : -1));
    setTimeout(() => wheelLock = false, 800);
  }, { passive: true });
  addEventListener('resize', () => { cards.forEach(dropCurl); cards.forEach(draw); });

  retarget();
  cards.forEach(draw);
</script>
</body>
</html>
